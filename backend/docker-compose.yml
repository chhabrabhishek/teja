# Optional. Local dev defaults to SQLite and no Redis — bring these up only when
# you want to develop against the same engines production runs on.
#   docker compose up -d
#   DATABASE_URL=postgres://dabble:dabble@localhost:5432/dabble
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dabble
      POSTGRES_PASSWORD: dabble
      POSTGRES_DB: dabble
    ports: ["5432:5432"]
    volumes: ["dabble_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dabble"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  dabble_pg:
